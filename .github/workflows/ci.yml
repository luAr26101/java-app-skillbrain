name: Java CI

on:
  push:
    branches: [lesson-1]
  pull_request:
    branches: [lesson-1]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build with Maven
        run: mvn -B -ntp clean test
